name: Windows release
on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml, Editor/FH6GarageEditor.csproj]
  workflow_dispatch:

permissions:
  contents: write
concurrency: windows-release

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows executable
        shell: pwsh
        run: |
          git clone --depth 1 --branch ForzaModToolV1.3.0.6 https://github.com/HTTPJXRDN/Forza-Mod-Tool.git .deps/Forza-Mod-Tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git -C .deps/Forza-Mod-Tool rev-parse HEAD) -ne '09cf655d964942346cc31995cd322062904bf893') { throw 'Unexpected dependency revision' }
          dotnet publish Editor/FH6GarageEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath dist/BetterCarTage.exe
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -Raw Editor/FH6GarageEditor.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a three-part editor version' }
          $tag = "v$version"
          $asset = 'dist/BetterCarTage.exe'
          if ((Get-Item $asset).VersionInfo.FileVersion -ne "$version.0") { throw 'EXE version does not match its tag' }
          $existing = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw "$tag belongs to another commit. Increase the editor version." }
            $release = $existing | ConvertFrom-Json
            if ($release.isDraft) { throw "$tag is a draft. Review the existing release before retrying." }
            if ($release.assets.name -contains 'BetterCarTage.exe') { exit 0 }
            gh release upload $tag $asset
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title $tag --notes "" --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
